<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Visite libre</title>
<style>
  :root {
    --green: #0b3d2e; --green-light: #145c44; --green-dark: #072a20;
    --gold: #d4af37; --gold-light: #e8cc6b;
    --bg: #f3f5f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(11,61,46,0.10), rgba(11,61,46,0) 60%),
      var(--bg);
    color: #1a1a1a; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 28px 16px;
  }
  .card {
    background: #fff; border-radius: 16px;
    box-shadow: 0 10px 40px rgba(11,61,46,0.14), 0 2px 8px rgba(0,0,0,0.06);
    max-width: 440px; width: 100%; overflow: hidden;
  }
  .hero {
    position: relative;
    background: linear-gradient(150deg, var(--green) 0%, var(--green-dark) 100%);
    padding: 30px 26px 22px;
    text-align: center;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 85% 15%, rgba(212,175,55,0.18), transparent 45%),
                       radial-gradient(circle at 10% 90%, rgba(255,255,255,0.06), transparent 40%);
    pointer-events: none;
  }
  .hero-gold-line { height: 3px; width: 56px; background: var(--gold); margin: 0 auto 14px; border-radius: 2px; }
  .monogram {
    width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%;
    background: linear-gradient(145deg, var(--gold-light), var(--gold));
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 20px; color: var(--green-dark);
    box-shadow: 0 4px 14px rgba(212,175,55,0.35);
    position: relative; z-index: 1;
  }
  .brand { position: relative; z-index: 1; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,0.78); margin-bottom: 6px; }
  .logo-img { position: relative; z-index: 1; display: block; margin: 0 auto 14px; max-width: 340px; width: 100%; height: auto; }
  h1 { position: relative; z-index: 1; font-family: Georgia, 'Times New Roman', serif; font-size: 22px; font-weight: 700; color: #fff; margin: 0 0 6px 0; }
  .adresse { position: relative; z-index: 1; color: rgba(255,255,255,0.88); font-size: 14px; }
  .adresse .pin { margin-right: 4px; }
  .body-pad { padding: 26px 24px 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin: 14px 0 5px; }
  input {
    width: 100%; padding: 11px 12px; border: 1.5px solid #dfe3df; border-radius: 9px; font-size: 15px;
    background: #fbfcfb; transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus { outline: none; border-color: var(--green-light); box-shadow: 0 0 0 3px rgba(11,61,46,0.12); background: #fff; }
  .req { color: #b3261e; }
  button {
    width: 100%; margin-top: 22px;
    background: linear-gradient(135deg, var(--green-light), var(--green-dark));
    color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15.5px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 14px rgba(11,61,46,0.28);
    transition: transform .12s, box-shadow .12s, opacity .12s;
  }
  button:disabled { opacity: 0.6; cursor: default; box-shadow: none; }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(11,61,46,0.34); }
  button:active:not(:disabled) { transform: translateY(0); }
  .consent-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid #eef0ee; }
  .consent-item { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 10px; }
  .consent-item input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--green); }
  .consent-item label { display: inline; font-size: 12px; font-weight: 400; color: #555; margin: 0; line-height: 1.45; }
  .consent-item a { color: var(--green); }
  .consent-item.optional label { color: #777; }
  .radio-group { margin-top: 6px; display: flex; gap: 10px; }
  .radio-option {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    border: 1.5px solid #dfe3df; border-radius: 9px; padding: 10px 8px; background: #fbfcfb;
    transition: border-color .15s, background .15s;
  }
  .radio-option:has(input:checked) { border-color: var(--green); background: rgba(11,61,46,0.05); }
  .radio-option input[type="radio"] { width: 16px; height: 16px; accent-color: var(--green); }
  .radio-option label { display: inline; font-size: 14px; font-weight: 500; color: #333; margin: 0; }
  .lang-group { margin: 0 0 4px; display: flex; gap: 8px; }
  .lang-option {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1.5px solid #dfe3df; border-radius: 9px; padding: 8px 6px; background: #fbfcfb;
    transition: border-color .15s, background .15s; cursor: pointer;
  }
  .lang-option:has(input:checked) { border-color: var(--green); background: rgba(11,61,46,0.05); }
  .lang-option input[type="radio"] { width: 14px; height: 14px; accent-color: var(--green); }
  .lang-option label { display: inline; font-size: 13px; font-weight: 500; color: #333; margin: 0; cursor: pointer; }
  .success { text-align: center; }
  .success .check {
    width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%;
    background: linear-gradient(145deg, var(--gold-light), var(--gold));
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 4px 14px rgba(212,175,55,0.35);
  }
  .success h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--green); font-size: 19px; margin: 0 0 8px; }
  .success p { color: #555; font-size: 14px; line-height: 1.5; }
  .footer-nap { text-align: center; font-size: 11px; color: #9aa39d; margin-top: 20px; line-height: 1.6; }
  .error-msg { color: #b3261e; font-size: 13px; margin-top: 10px; display: none; }
  [hidden] { display: none !important; }
</style>
</head>

    <div class="body-pad">
    <form id="signin-form">
      <label data-i18n="lbl-langue">Langue préférée</label>
      <div class="lang-group">
        <div class="lang-option">
          <input type="radio" name="langue" id="langue-fr" value="fr" checked>
          <label for="langue-fr">Français</label>
        </div>
        <div class="lang-option">
          <input type="radio" name="langue" id="langue-en" value="en">
          <label for="langue-en">English</label>

        <div class="lang-option">
          <input type="radio" name="langue" id="langue-zh" value="zh">
          <label for="langue-zh">中文</label>
        </div>
      </div>

      <label data-i18n="lbl-prenom">Prénom <span class="req">*</span></label>
      <input type="text" id="firstName" required autocomplete="given-name">

      <label data-i18n="lbl-nom">Nom <span class="req">*</span></label>
      <input type="text" id="lastName" required autocomplete="family-name">

      <label data-i18n="lbl-courriel">Courriel <span class="req">*</span></label>
      <input type="email" id="email" required autocomplete="email">

      <label data-i18n="lbl-telephone">Téléphone <span style="color:#999; font-weight:400;">(optionnel)</span></label>
      <input type="tel" id="phone" autocomplete="tel">

      <label data-i18n="lbl-represente">Êtes-vous représenté(e) par un courtier immobilier ? <span class="req">*</span></label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" name="represente" id="represente-oui" value="oui" required>
          <label for="represente-oui" data-i18n="opt-oui">Oui</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="represente" id="represente-non" value="non" required>
          <label for="represente-non" data-i18n="opt-non">Non</label>
        </div>
      </div>

      <div class="consent-block">
        <div class="consent-item">
          <input type="checkbox" id="consent-required" required>
          <label for="consent-required">
            <span id="consent-required-text" data-i18n-html="consent-required">J'accepte que mes coordonnées soient utilisées par Endurance Groupe Immobilier par Tardif pour me faire parvenir la fiche de cette propriété et assurer le suivi de ma visite. Elles seront conservées dans notre système de gestion de clientèle le temps nécessaire à ce suivi, puis supprimées si aucune relation d'affaires ne se poursuit. Je peux demander l'accès, la rectification ou le retrait de mes renseignements en tout temps en écrivant à <a href="mailto:info@enduranceimmobilier.com">info@enduranceimmobilier.com</a>. <a href="https://enduranceimmobilier.com/politique-de-confidentialite/" target="_blank" rel="noopener">Politique de confidentialité complète</a>.</span> <span class="req">*</span>
          </label>
        </div>
        <div class="consent-item optional">
          <input type="checkbox" id="consent-marketing">

          </label>
        </div>
        <div class="consent-item optional">
          <input type="checkbox" id="consent-dv">
          <label for="consent-dv" data-i18n="consent-dv">

        </div>
      </div>

<script>
  // ====== CONFIGURATION PAR PROPRIÉTÉ (via l'URL du QR code) ======

  // https://votre-domaine.com/visite-libre.html?adresse=805-807%20Rue%20Melrose&mls=26759159&courtier=Martin%20Rodrigue

  const adresse   = params.get('adresse')   || 'cette propriété';
  const mls       = params.get('mls')       || '';
  const courtier  = params.get('courtier')  || 'Martin Rodrigue';

  // La fiche et la DV en pièce jointe ne dépendent d'AUCUN paramètre ici :
  // Code.gs les retrouve automatiquement dans le dossier Drive de cette
  // visite libre (nommé "[MLS] - [adresse]"), déposées séparément.

  document.getElementById('adresse-label').textContent =
    adresse + (mls ? ' — MLS ' + mls : '');
